description: Break the change down into granular, ordered, verifiable tasks in tasks.md.
instruction: 'STAGE: plan-change. Read ~/.hermes/workflows/plan-change.md in full before acting and run
  its preflight exactly as written. Resolve the project root (pwd -P + openspec context --json) and compare
  it against the expected root; if ambiguous, stop and report. Load the agents/personas the workflow names.
  Validate each agent''s output in the real repo before advancing. Close with templates/final-report.md.
  Never improvise stages or skip the gate.'
