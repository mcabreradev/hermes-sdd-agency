<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 2030" width="100%" role="img" aria-label="Hermes SDD Agency orchestration flow">
<rect width="860" height="2030" fill="#171512"/>
<text x="24" y="40" font-size="17" font-weight="700" fill="#e8e2d5">Hermes SDD Agency — flujo de orquestación</text>
<text x="24" y="62" font-size="12" fill="#b3ab9c">Hermes = único bus · OpenSpec dentro del repo del proyecto · solo review y QA pueden bloquear</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8273"/></marker></defs>
<rect x="100" y="58" width="480" height="56" rx="12" fill="#3d3a2e" stroke="#d4a72c" stroke-width="1.6"/>
<text x="340" y="86" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f0e6c8">Migue — idea clara + repo</text>
<polygon points="340,152 540,188 340,224 140,188" fill="#3b2733" stroke="#f0a6c9" stroke-width="1.6"/>
<text x="340" y="184" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8dcec">¿openspec/project.md?</text>
<text x="340" y="202" text-anchor="middle" font-size="10.5" fill="#b3ab9c">marca de entrada al loop</text>
<rect x="100" y="254" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="276" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">0 · Initialize</text>
<text x="340" y="296" text-anchor="middle" font-size="11" fill="#b3ab9c">crea openspec/ + project.md — sin esto nada arranca</text>
<rect x="100" y="342" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="364" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">1 · Discovery</text>
<text x="340" y="384" text-anchor="middle" font-size="11" fill="#b3ab9c">explora el dominio → PRD</text>
<rect x="100" y="430" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="452" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">2 · Specs (OpenSpec CLI)</text>
<text x="340" y="472" text-anchor="middle" font-size="11" fill="#b3ab9c">proposal + delta spec con Scenario:</text>
<polygon points="340,530 540,566 340,602 140,566" fill="#3b2733" stroke="#f0a6c9" stroke-width="1.6"/>
<text x="340" y="562" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8dcec">validate sin ERROR</text>
<text x="340" y="580" text-anchor="middle" font-size="10.5" fill="#b3ab9c">+ grep anti-trampas</text>
<rect x="100" y="632" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="654" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">3 · Architecture</text>
<text x="340" y="674" text-anchor="middle" font-size="11" fill="#b3ab9c">design + ADR si hay decisión costosa</text>
<rect x="100" y="720" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="742" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">4 · Plan</text>
<text x="340" y="762" text-anchor="middle" font-size="11" fill="#b3ab9c">tasks.md — tareas ≤1 día verificables</text>
<polygon points="340,820 540,856 340,892 140,856" fill="#3b2733" stroke="#f0a6c9" stroke-width="1.6"/>
<text x="340" y="852" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8dcec">preflight: root + proyecto</text>
<text x="340" y="870" text-anchor="middle" font-size="10.5" fill="#b3ab9c">validate + project.md + root ok</text>
<rect x="100" y="922" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="944" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">5 · Build — única etapa que escribe código</text>
<text x="340" y="964" text-anchor="middle" font-size="11" fill="#b3ab9c">TDD hard rule: RED → GREEN → REFACTOR</text>
<rect x="100" y="1010" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="1032" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">6 · Review adversarial</text>
<text x="340" y="1052" text-anchor="middle" font-size="11" fill="#b3ab9c">findings BLOCKER / MAJOR / MINOR</text>
<polygon points="340,1110 540,1146 340,1182 140,1146" fill="#3b2733" stroke="#f0a6c9" stroke-width="1.6"/>
<text x="340" y="1142" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8dcec">¿review approved?</text>
<text x="340" y="1160" text-anchor="middle" font-size="10.5" fill="#b3ab9c">sin BLOCKER/MAJOR abiertos</text>
<rect x="100" y="1212" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="1234" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">7 · QA formal</text>
<text x="340" y="1254" text-anchor="middle" font-size="11" fill="#b3ab9c">escenarios ejecutados contra la app real</text>
<polygon points="340,1312 540,1348 340,1384 140,1348" fill="#3b2733" stroke="#f0a6c9" stroke-width="1.6"/>
<text x="340" y="1344" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8dcec">¿qa pass?</text>
<text x="340" y="1362" text-anchor="middle" font-size="10.5" fill="#b3ab9c">evidencia = ejecución real, no lectura</text>
<rect x="100" y="1414" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="1436" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">8 · Release</text>
<text x="340" y="1456" text-anchor="middle" font-size="11" fill="#b3ab9c">notas + archive + sync specs</text>
<rect x="100" y="1502" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="1524" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">Reporte final + git status limpio</text>
<text x="340" y="1544" text-anchor="middle" font-size="11" fill="#b3ab9c">toda etapa cierra con reporte</text>
<rect x="100" y="1590" width="480" height="56" rx="12" fill="#24322b" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340" y="1612" text-anchor="middle" font-size="13.5" font-weight="650" fill="#d6f5e8">PR abierto (nunca draft)</text>
<text x="340" y="1632" text-anchor="middle" font-size="11" fill="#b3ab9c">gh pr ready si quedó draft</text>
<polygon points="340,1690 540,1726 340,1762 140,1726" fill="#3b2733" stroke="#f0a6c9" stroke-width="1.6"/>
<text x="340" y="1722" text-anchor="middle" font-size="12.5" font-weight="650" fill="#f8dcec">CI verde</text>
<text x="340" y="1740" text-anchor="middle" font-size="10.5" fill="#b3ab9c">gate post-open: corre DESPUÉS de publicar</text>
<rect x="100" y="1792" width="480" height="56" rx="12" fill="#2b2b3d" stroke="#9aa5f0" stroke-width="1.6"/>
<text x="340" y="1814" text-anchor="middle" font-size="13.5" font-weight="650" fill="#dfe3fb">9 · pr-review (post-open)</text>
<text x="340" y="1834" text-anchor="middle" font-size="11" fill="#b3ab9c">review de dominio + QA formal obligatorio — no mergea</text>
<rect x="100" y="1880" width="480" height="56" rx="12" fill="#3d3a2e" stroke="#d4a72c" stroke-width="1.6"/>
<text x="340" y="1902" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f0e6c8">PR approved ✅</text>
<text x="340" y="1922" text-anchor="middle" font-size="11" fill="#b3ab9c">el merge es decisión humana, nunca de la agencia</text>
<rect x="690" y="824" width="200" height="64" rx="10" fill="#3a2424" stroke="#f08080" stroke-width="1.6"/>
<text x="790" y="852" text-anchor="middle" font-size="12.5" font-weight="650" fill="#fbdada">⛔ Stop — no código sin</text>
<text x="790" y="870" text-anchor="middle" font-size="11" fill="#b3ab9c">change validado</text>
